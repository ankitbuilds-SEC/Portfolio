<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Contact Messages</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1a1f2e 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #334155;
    }

    h1 {
      color: #38bdf8;
      font-size: 28px;
    }

    .logout-btn {
      padding: 8px 16px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    .login-box {
      background: linear-gradient(135deg, #111827 0%, #1e293b 100%);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 30px;
      max-width: 400px;
    }

    .login-box h3 {
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      margin-bottom: 12px;
      background: #0f172a;
      color: white;
      font-size: 14px;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background: #38bdf8;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .login-box button:hover {
      background: #0ea5e9;
    }

    .filters {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
    }

    .search-box input {
      width: 100%;
      padding: 12px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
      color: white;
      font-size: 14px;
    }

    .status-filter {
      display: flex;
      gap: 8px;
    }

    .status-btn {
      padding: 8px 16px;
      background: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .status-btn:hover,
    .status-btn.active {
      background: #38bdf8;
      color: #000;
      border-color: #38bdf8;
    }

    .messages-container {
      display: grid;
      gap: 20px;
    }

    .message-card {
      background: linear-gradient(135deg, #111827 0%, #1e293b 100%);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      transition: all 0.3s;
    }

    .message-card:hover {
      border-color: #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.1);
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 15px;
      gap: 15px;
    }

    .message-meta {
      flex: 1;
    }

    .message-id {
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .message-from {
      display: flex;
      gap: 15px;
      margin-bottom: 10px;
    }

    .message-from strong {
      color: #38bdf8;
      word-break: break-all;
    }

    .message-from a {
      color: #0ea5e9;
      text-decoration: none;
      font-size: 14px;
    }

    .message-from a:hover {
      text-decoration: underline;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-new {
      background: #3b82f6;
      color: white;
    }

    .status-read {
      background: #8b5cf6;
      color: white;
    }

    .status-replied {
      background: #10b981;
      color: white;
    }

    .status-archived {
      background: #6b7280;
      color: white;
    }

    .message-content {
      margin: 15px 0;
    }

    .message-subject {
      font-size: 16px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 8px;
    }

    .message-text {
      font-size: 14px;
      line-height: 1.6;
      color: #cbd5e1;
      background: #0f172a;
      padding: 12px;
      border-radius: 6px;
      border-left: 3px solid #38bdf8;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message-timestamp {
      font-size: 12px;
      color: #64748b;
      margin-top: 12px;
    }

    .reply-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #334155;
    }

    .reply-section textarea {
      width: 100%;
      min-height: 80px;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: white;
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 10px;
      resize: vertical;
    }

    .message-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .action-btn {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .action-btn.primary {
      background: #38bdf8;
      color: #000;
    }

    .action-btn.primary:hover {
      background: #0ea5e9;
    }

    .action-btn.secondary {
      background: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
    }

    .action-btn.secondary:hover {
      background: #475569;
      border-color: #64748b;
    }

    .action-btn.danger {
      background: #ef4444;
      color: white;
    }

    .action-btn.danger:hover {
      background: #dc2626;
    }

    .status-message {
      font-size: 12px;
      color: #10b981;
      margin-top: 8px;
      min-height: 16px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
    }

    .empty-state p {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .management-section {
      margin-top: 28px;
      padding: 24px;
      background: linear-gradient(135deg, #111827 0%, #1e293b 100%);
      border: 1px solid #334155;
      border-radius: 12px;
    }

    .management-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .management-header h2 {
      color: #38bdf8;
      font-size: 22px;
    }

    .mini-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #000;
      font-weight: 700;
      cursor: pointer;
    }

    .edu-admin-list {
      display: grid;
      gap: 14px;
    }

    .edu-admin-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
    }

    .edu-admin-card h3 {
      color: #f8fafc;
      margin-bottom: 8px;
    }

    .edu-admin-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: #cbd5e1;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .edu-admin-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .edu-admin-actions button {
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .edu-admin-actions .edit {
      background: #38bdf8;
      color: #000;
    }

    .edu-admin-actions .delete {
      background: #ef4444;
      color: white;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.78);
      display: none;
      place-items: center;
      padding: 20px;
      z-index: 200;
    }

    .modal.open {
      display: grid;
    }

    .modal-panel {
      width: min(760px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-header h3 {
      color: #38bdf8;
    }

    .modal-close {
      background: transparent;
      color: white;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }

    .edu-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .edu-form-grid .full {
      grid-column: 1 / -1;
    }

    .edu-form-grid label {
      display: block;
      margin-bottom: 6px;
      color: #cbd5e1;
      font-size: 13px;
    }

    .edu-form-grid input,
    .edu-form-grid select,
    .edu-form-grid textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #111827;
      color: white;
      font-family: inherit;
    }

    .edu-form-grid textarea {
      min-height: 110px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 18px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: linear-gradient(135deg, #111827 0%, #1e293b 100%);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 15px;
        align-items: start;
      }

      .filters {
        flex-direction: column;
      }

      .search-box {
        min-width: 100%;
      }

      .status-filter {
        flex-wrap: wrap;
      }

      .message-header {
        flex-direction: column;
      }

      .message-from {
        flex-direction: column;
        gap: 5px;
      }

      .message-actions {
        flex-direction: column;
      }

      .action-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header" id="headerSection" style="display: none;">
      <h1>📧 Contact Messages</h1>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div id="loginBox" class="login-box">
      <h3>Admin Login</h3>
      <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">
        Enter your admin credentials to manage contact messages
      </p>
      <input id="username" placeholder="Username" autocomplete="username" />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
      <button onclick="login()">Login</button>
    </div>

    <div id="adminPanel" style="display: none;">
      <div class="stats" id="statsContainer"></div>

      <div class="filters">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="🔍 Search by name or email..." onkeyup="filterMessages()" />
        </div>
        <div class="status-filter">
          <button class="status-btn active" data-status="all" onclick="filterByStatus('all')">All</button>
          <button class="status-btn" data-status="new" onclick="filterByStatus('new')">New</button>
          <button class="status-btn" data-status="read" onclick="filterByStatus('read')">Read</button>
          <button class="status-btn" data-status="replied" onclick="filterByStatus('replied')">Replied</button>
          <button class="status-btn" data-status="archived" onclick="filterByStatus('archived')">Archived</button>
        </div>
      </div>

      <div class="messages-container" id="messagesContainer"></div>

      <section class="management-section">
        <div class="management-header">
          <h2>Education Manager</h2>
          <button class="mini-btn" onclick="openEducationModal()">Add Education</button>
        </div>
        <div id="educationList" class="edu-admin-list"></div>
      </section>
    </div>

    <div id="educationModal" class="modal" aria-modal="true" role="dialog">
      <div class="modal-panel">
        <div class="modal-header">
          <h3 id="educationModalTitle">Add Education</h3>
          <button type="button" class="modal-close" onclick="closeEducationModal()">×</button>
        </div>

        <form id="educationForm">
          <div class="edu-form-grid">
            <div class="full">
              <label>Degree or Qualification</label>
              <input type="text" name="degree" required />
            </div>
            <div class="full">
              <label>Institution / University</label>
              <input type="text" name="institution" required />
            </div>
            <div>
              <label>College (if applicable)</label>
              <input type="text" name="college" />
            </div>
            <div>
              <label>Field of Study</label>
              <input type="text" name="field_of_study" />
            </div>
            <div>
              <label>Start Year</label>
              <input type="number" name="start_year" min="1900" max="2100" />
            </div>
            <div>
              <label>End / Expected Year</label>
              <input type="number" name="end_year" min="1900" max="2100" />
            </div>
            <div>
              <label>Status</label>
              <select name="status">
                <option value="Completed">Completed</option>
                <option value="Pursuing">Pursuing</option>
                <option value="Discontinued">Discontinued</option>
              </select>
            </div>
            <div>
              <label>Grade / CGPA / Percentage</label>
              <input type="text" name="grade" />
            </div>
            <div>
              <label>Location</label>
              <input type="text" name="location" />
            </div>
            <div>
              <label>Institution Logo URL</label>
              <input type="url" name="logo_url" />
            </div>
            <div class="full">
              <label>Relevant Coursework</label>
              <textarea name="coursework"></textarea>
            </div>
            <div class="full">
              <label>Academic Achievements</label>
              <textarea name="achievements"></textarea>
            </div>
            <div class="full">
              <label>Description</label>
              <textarea name="description"></textarea>
            </div>
            <div class="full">
              <label>Supporting Document Link</label>
              <input type="url" name="document_url" />
            </div>
            <div class="full">
              <label>
                <input type="checkbox" name="published" checked /> Published on the portfolio
              </label>
            </div>
          </div>

          <div class="modal-actions">
            <button type="button" class="action-btn secondary" onclick="closeEducationModal()">Cancel</button>
            <button type="submit" class="action-btn primary">Save Education</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const apiBase = window.__API_BASE__ || (window.location.hostname === 'localhost' ? 'http://localhost:3000' : window.location.origin);
    let authHeader = '';
    let allMessages = [];
    let currentFilter = 'all';
    let currentSearchTerm = '';

    // Restore saved username and verify whether the current browser already has a valid admin session.
    window.addEventListener('load', async () => {
      const savedUsername = localStorage.getItem('adminUsername');
      if (savedUsername) {
        document.getElementById('username').value = savedUsername;
      }

      try {
        const sessionResponse = await fetch(`${apiBase}/api/admin/session`, {
          credentials: 'same-origin'
        });

        if (sessionResponse.ok) {
          await loadMessages();
        }
      } catch (error) {
        console.log('No active admin session found.');
      }
    });

    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      if (!username || !password) {
        alert('Please enter username and password');
        return;
      }

      try {
        const res = await fetch(`${apiBase}/api/admin/login`, {
          method: 'POST',
          credentials: 'same-origin',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'Invalid admin credentials');
        }

        localStorage.setItem('adminUsername', username);
        authHeader = 'Basic ' + btoa(`${username}:${password}`);
        await loadMessages();
      } catch (error) {
        alert(error.message || 'Login failed');
      }
    }

    async function logout() {
      authHeader = '';
      allMessages = [];
      currentFilter = 'all';
      currentSearchTerm = '';

      try {
        await fetch(`${apiBase}/api/admin/logout`, {
          method: 'POST',
          credentials: 'same-origin'
        });
      } catch (error) {
        console.log('Logout request failed silently.');
      }

      localStorage.removeItem('adminUsername');
      document.getElementById('loginBox').style.display = 'block';
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('headerSection').style.display = 'none';
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
    }

    async function loadMessages() {
      const messagesContainer = document.getElementById('messagesContainer');
      const headerSection = document.getElementById('headerSection');
      const loginBox = document.getElementById('loginBox');
      const adminPanel = document.getElementById('adminPanel');

      try {
        if (!authHeader) {
          messagesContainer.innerHTML = '<p class="empty">Please log in to view messages.</p>';
          return;
        }

        messagesContainer.innerHTML = '<p class="empty">Loading messages...</p>';

        const res = await fetch(`${apiBase}/api/messages`, {
          credentials: 'same-origin',
          headers: authHeader ? { Authorization: authHeader } : {}
        });

        if (res.status === 401) {
          logout();
          alert('Invalid admin credentials. Please try again.');
          return;
        }

        if (!res.ok) {
          throw new Error('Unable to load messages');
        }

        allMessages = await res.json();
        loginBox.style.display = 'none';
        headerSection.style.display = 'flex';
        adminPanel.style.display = 'block';

        renderStats();
        renderMessages();
        await loadEducationManager();
        await loadEducationPageData();
      } catch (error) {
        console.error('Error:', error);
        messagesContainer.innerHTML = '<p class="empty">Error loading messages. Please try again.</p>';
      }
    }

    let educationEditId = null;

    async function loadEducationManager() {
      const list = document.getElementById('educationList');
      if (!list) return;

      try {
        const res = await fetch(`${apiBase}/api/education`, {
          headers: { Authorization: authHeader }
        });

        if (!res.ok) {
          throw new Error('Unable to load education records');
        }

        const records = await res.json();
        if (!records.length) {
          list.innerHTML = '<div class="empty-state"><p>📚 No education records found.</p></div>';
          return;
        }

        list.innerHTML = records.map((record) => `
          <div class="edu-admin-card">
            <h3>${record.degree}</h3>
            <div class="edu-admin-meta">
              <span>${record.institution}</span>
              ${record.field_of_study ? `<span>• ${record.field_of_study}</span>` : ''}
              ${record.status ? `<span>• ${record.status}</span>` : ''}
              ${record.start_year ? `<span>• ${record.start_year}</span>` : ''}
              ${record.end_year ? `<span>• ${record.end_year}</span>` : ''}
            </div>
            <div class="edu-admin-actions">
              <button class="edit" type="button" onclick="openEducationModal(${record.id})">Edit</button>
              <button class="delete" type="button" onclick="deleteEducationRecord(${record.id})">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        list.innerHTML = '<div class="empty-state"><p>⚠️ Unable to load education manager.</p></div>';
      }
    }

    function openEducationModal(id = null) {
      const modal = document.getElementById('educationModal');
      const form = document.getElementById('educationForm');
      const title = document.getElementById('educationModalTitle');
      educationEditId = id;
      title.textContent = id ? 'Edit Education' : 'Add Education';
      form.reset();

      if (id) {
        const record = allEducationCache.find(item => item.id === id);
        if (record) {
          Object.entries(record).forEach(([key, value]) => {
            const field = form.elements.namedItem(key);
            if (!field) return;
            if (field.type === 'checkbox') {
              field.checked = Boolean(value);
            } else {
              field.value = value || '';
            }
          });
        }
      }

      modal.classList.add('open');
    }

    function closeEducationModal() {
      const modal = document.getElementById('educationModal');
      modal.classList.remove('open');
      educationEditId = null;
      const form = document.getElementById('educationForm');
      form.reset();
    }

    function getEducationFormValues() {
      const form = document.getElementById('educationForm');
      const payload = {};
      Object.keys(form.elements).forEach((index) => {
        const field = form.elements[index];
        if (!field || !field.name) return;
        if (field.type === 'checkbox') {
          payload[field.name] = field.checked;
        } else if (field.type === 'submit' || field.type === 'button') {
          return;
        } else {
          payload[field.name] = field.value;
        }
      });
      return payload;
    }

    async function saveEducationRecord(event) {
      event.preventDefault();

      const payload = getEducationFormValues();
      const method = educationEditId ? 'PATCH' : 'POST';
      const url = educationEditId ? `${apiBase}/api/education/${educationEditId}` : `${apiBase}/api/education`;

      try {
        const res = await fetch(url, {
          method,
          headers: {
            'Content-Type': 'application/json',
            Authorization: authHeader
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || 'Unable to save education record');
        }

        closeEducationModal();
        await loadEducationManager();
        await loadEducationPageData();
      } catch (error) {
        alert(error.message || 'Unable to save education record');
      }
    }

    async function deleteEducationRecord(id) {
      if (!confirm('Delete this education record?')) return;
      try {
        const res = await fetch(`${apiBase}/api/education/${id}`, {
          method: 'DELETE',
          headers: { Authorization: authHeader }
        });

        if (!res.ok) {
          throw new Error('Unable to delete education record');
        }

        await loadEducationManager();
        await loadEducationPageData();
      } catch (error) {
        alert(error.message || 'Unable to delete education record');
      }
    }

    let allEducationCache = [];

    async function loadEducationPageData() {
      try {
        const res = await fetch(`${apiBase}/api/education`, {
          headers: { Authorization: authHeader }
        });
        if (!res.ok) return;
        allEducationCache = await res.json();
      } catch (error) {
        allEducationCache = [];
      }
    }

    function renderStats() {
      const statsContainer = document.getElementById('statsContainer');
      const total = allMessages.length;
      const newCount = allMessages.filter(m => m.status === 'new').length;
      const readCount = allMessages.filter(m => m.status === 'read').length;
      const repliedCount = allMessages.filter(m => m.status === 'replied').length;

      statsContainer.innerHTML = `
        <div class="stat-card">
          <div class="stat-value">${total}</div>
          <div class="stat-label">Total Messages</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" style="color: #3b82f6;">${newCount}</div>
          <div class="stat-label">New</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" style="color: #8b5cf6;">${readCount}</div>
          <div class="stat-label">Read</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" style="color: #10b981;">${repliedCount}</div>
          <div class="stat-label">Replied</div>
        </div>
      `;
    }

    function filterByStatus(status) {
      currentFilter = status;
      document.querySelectorAll('.status-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      document.querySelector(`[data-status="${status}"]`).classList.add('active');
      renderMessages();
    }

    function filterMessages() {
      currentSearchTerm = document.getElementById('searchInput').value.toLowerCase();
      renderMessages();
    }

    function renderMessages() {
      const messagesContainer = document.getElementById('messagesContainer');

      let filtered = allMessages;

      // Filter by status
      if (currentFilter !== 'all') {
        filtered = filtered.filter(m => m.status === currentFilter);
      }

      // Filter by search term
      if (currentSearchTerm) {
        filtered = filtered.filter(m =>
          (m.name && m.name.toLowerCase().includes(currentSearchTerm)) ||
          (m.email && m.email.toLowerCase().includes(currentSearchTerm))
        );
      }

      if (!filtered.length) {
        messagesContainer.innerHTML = '<div class="empty-state"><p>📭 No messages found</p></div>';
        return;
      }

      messagesContainer.innerHTML = filtered.map(msg => formatMessageCard(msg)).join('');
    }

    function formatMessageCard(msg) {
      const date = new Date(msg.created_at);
      const formattedDate = date.toLocaleString();
      const statusClass = `status-${msg.status || 'new'}`;
      const statusLabel = (msg.status || 'new').charAt(0).toUpperCase() + (msg.status || 'new').slice(1);

      return `
        <div class="message-card">
          <div class="message-header">
            <div class="message-meta">
              <div class="message-id">#${msg.id}</div>
              <div class="message-from">
                <strong>${msg.name}</strong>
                <a href="mailto:${msg.email}" title="Send email">${msg.email}</a>
              </div>
              <span class="status-badge ${statusClass}">${statusLabel}</span>
            </div>
          </div>

          <div class="message-content">
            ${msg.subject ? `<div class="message-subject">📌 ${msg.subject}</div>` : ''}
            <div class="message-text">${msg.message}</div>
          </div>

          ${msg.reply ? `
            <div style="background: #0f172a; padding: 12px; border-radius: 6px; margin: 12px 0; border-left: 3px solid #10b981;">
              <strong style="color: #10b981;">✓ Your Reply:</strong>
              <div style="margin-top: 8px; color: #cbd5e1; white-space: pre-wrap;">${msg.reply}</div>
            </div>
          ` : ''}

          <div class="message-timestamp">
            📅 ${formattedDate}
          </div>

          <div class="reply-section">
            <textarea id="reply-${msg.id}" placeholder="Type your reply here..." style="${msg.status === 'replied' ? 'display: none;' : ''}"></textarea>
            ${msg.status !== 'replied' ? `
              <div class="message-actions">
                <button class="action-btn primary" onclick="sendReply(${msg.id})">Send Reply</button>
            ` : ''}
            
            <button class="action-btn secondary" onclick="updateStatus(${msg.id}, '${msg.status === 'read' ? 'new' : 'read'}')">
              ${msg.status === 'read' ? 'Mark as New' : 'Mark as Read'}
            </button>
            <button class="action-btn secondary" onclick="updateStatus(${msg.id}, '${msg.status === 'archived' ? 'new' : 'archived'}')">
              ${msg.status === 'archived' ? 'Restore' : 'Archive'}
            </button>
            <button class="action-btn danger" onclick="confirmDelete(${msg.id})">Delete</button>
            ${msg.status !== 'replied' ? '</div>' : ''}
            <div class="status-message" id="status-${msg.id}"></div>
          </div>
        </div>
      `;
    }

    async function sendReply(id) {
      const textarea = document.getElementById(`reply-${id}`);
      const statusDiv = document.getElementById(`status-${id}`);
      const reply = textarea.value.trim();

      if (!reply) {
        statusDiv.textContent = '⚠️ Please type a reply first';
        statusDiv.style.color = '#f59e0b';
        return;
      }

      statusDiv.textContent = '⏳ Sending reply...';
      statusDiv.style.color = '#38bdf8';

      try {
        const res = await fetch(`${apiBase}/api/messages/${id}/reply`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: authHeader
          },
          body: JSON.stringify({ reply })
        });

        if (res.ok) {
          statusDiv.textContent = '✓ Reply sent and message marked as replied';
          statusDiv.style.color = '#10b981';
          textarea.value = '';
          await loadMessages();
        } else {
          const data = await res.json().catch(() => ({}));
          statusDiv.textContent = '❌ ' + (data.error || 'Unable to send reply');
          statusDiv.style.color = '#ef4444';
        }
      } catch (error) {
        statusDiv.textContent = '❌ Network error';
        statusDiv.style.color = '#ef4444';
      }
    }

    async function updateStatus(id, status) {
      try {
        const res = await fetch(`${apiBase}/api/messages/${id}/status`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            Authorization: authHeader
          },
          body: JSON.stringify({ status })
        });

        if (res.ok) {
          await loadMessages();
        } else {
          alert('Failed to update status');
        }
      } catch (error) {
        alert('Error updating status');
      }
    }

    function confirmDelete(id) {
      if (confirm('Are you sure you want to delete this message? This action cannot be undone.')) {
        deleteMessage(id);
      }
    }

    async function deleteMessage(id) {
      try {
        const res = await fetch(`${apiBase}/api/messages/${id}`, {
          method: 'DELETE',
          headers: { Authorization: authHeader }
        });

        if (res.ok) {
          await loadMessages();
        } else {
          alert('Failed to delete message');
        }
      } catch (error) {
        alert('Error deleting message');
      }
    }

    document.getElementById('educationForm').addEventListener('submit', saveEducationRecord);
  </script>
</body>
</html>
