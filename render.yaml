services:
  - type: web
    name: ankit-portfolio
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: ADMIN_EMAIL
        value: ""
      - key: EMAIL_FROM_NAME
        value: Portfolio Contact Form
      - key: OPENAI_API_KEY
        value: ""
      - key: OPENAI_MODEL
        value: gpt-4o-mini
